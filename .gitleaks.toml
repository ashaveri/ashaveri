title = "Ashaveri secret scan configuration"

# The built-in rules do the detection and this file only extends them. That distinction
# is load-bearing: a config that lists allowlists without useDefault replaces the built-in
# rule set with an empty one, which reports nothing on a tree holding live credentials and
# reads exactly like a clean repository. Measured on 8.30.1, deleting the two lines below
# turned a repository holding a fabricated npm token into a scan that passed.
[extend]
useDefault = true

# Two deterministic test keys are published in the fixtures deliberately, each in the same
# object as the public half it pairs with, so a scanner with no context has to be told they
# are not credentials. Below, each value is exempted in its own block, paired with the one
# file that carries it, so the exemption is the intersection rather than the cross product:
# measured on a copy of this repository, the PoP fixture's key held by the receipt fixture's
# file is reported, and so is a third key planted inside either file. Two blocks joined into
# one would let the first of those through. Copying either value to any other path is
# reported too, which is the reason each path below names a single file.
#
# A third block sits below for a different reason. It exempts the public half of the receipt
# fixture's key at the one place a document prints it: the verify-pack example in README.md,
# where the same bytes appear base64url rather than hex and the sentence under the example
# names the file that publishes them. It is the verification key, not the signing key, so the
# private half above is untouched by it. Measured on 8.30.1 against a clone of this
# repository: the scan reports README.md's example with no block below, reports nothing with
# it, and reports both a copy of that value placed in another file and a different key left
# in README.md itself. The exemption is the intersection, so neither half of it is loose.
#
# One limit, measured rather than assumed: the value half of the pairing is enforced when a
# scan reads commits, which is how CI runs it, and not when a scan reads a working tree. On
# one tree, one config and gitleaks 8.30.1, the commit scan reported a second key planted
# inside a file named below and the working-tree scan reported nothing. Both files named
# below are generated from code, so a value pasted over a fixture's own slot also fails the
# check that regenerates them.
[[allowlists]]
description = "The PoP fixture's signing key, in the file that publishes it"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^d1332ee54c62ab3f5336167d4d694944ed98509395a5529e165e043013de19dd$''',
]
paths = [
  '''^packages/fixtures/data/pop-v1\.json$''',
]

[[allowlists]]
description = "The receipt fixture's signing key, in the file that publishes it"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^83323642bdd8d84c58b3d208d07b4dfc7d84be7b4d670d2272a7ea328f2a06b7$''',
]
paths = [
  '''^packages/fixtures/data/keys/receipt-key-v1\.json$''',
]

[[allowlists]]
description = "The receipt fixture's public verification key, in the README example that prints it"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^E6uO0ed3_zm-Ix32lLu8j5Z9W3eet8q1WHYstU-WCwU$''',
]
paths = [
  '''^README\.md$''',
]

# A fourth block, and it exempts a key identifier rather than a key. The epoch inventory suite publishes a
# refusal message verbatim, and that message's shape is `header kid=<hex> key kid=<hex>` (the four readers
# that answer a kid mismatch spell it that way, so the fixture quotes what the product prints). The built-in
# generic-api-key rule reads the `key kid=` prefix and the 64 hex characters behind it as a credential
# candidate. Both hexes are sha256 of a public half, printed beside that same public half in the file's own
# `keyMaterial` rows, so nothing secret is named. The same value sits in two places in this one file, the
# row and the message that quotes it, which is what a path-scoped value block covers.
#
# Measured on 8.30.1 against the history of this branch: the scan reports this file with no block below and
# reports nothing with it. A different 64-hex value planted after the same `key kid=` prefix in this same
# file is still reported, and this value copied into another file is still reported, because the exemption
# is the intersection of the two lines below and not either one alone. The file is generated, so a hand
# pasted over its slot also fails the job that regenerates it.
[[allowlists]]
description = "The epoch inventory fixture's key identifier, in the file that publishes it"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^acfdc127e917bc235da5153b4c65cb7c45fc755ab3c6aa2b299869925be19803$''',
]
paths = [
  '''^packages/fixtures/data/epoch-inventory-v1\.json$''',
]

# A fifth block, and it exempts a marker rather than a key. The gateway's provenance case puts one short
# string in the prompt, the completion, the model id and the credential of every request it issues, then
# asserts that string reaches none of the receipt's text members. The value is a canary: it authenticates
# nothing, and eight hex characters behind a word is too short for any real credential to be. The built-in
# generic-api-key rule matched it anyway, at the line that declared the constant under the name `TOKEN`,
# because that rule reads the name beside the value rather than what the value is worth. The constant now
# carries the name the case uses for the thing, so no line of the current tree matches. This block exists
# because the scan reads commits, and the line that introduced the shape stays in the history whatever the
# constant is called after it.
#
# Measured on 8.30.1 against this repository's history: the scan reports the file with no block below and
# reports nothing with it. The same value written into another file in a fresh commit is still reported, and
# a different value declared the same way inside this file is still reported, because the exemption is the
# intersection of the two lines below and not either one alone.
[[allowlists]]
description = "The provenance case's canary marker, in the file that asserts it goes nowhere"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^CANARY-4f7b2e9a$''',
]
paths = [
  '''^gateway/test/receipt-provenance\.test\.ts$''',
]

# A sixth block, and like the fourth it exempts an identifier rather than a key. Every accepted row of the
# capture fixture publishes `recordKey`, which is sha256 of that record’s canonical JSON, and the built-in
# generic-api-key rule reads the `"recordKey":` prefix plus the 64 hex characters behind it as a credential
# candidate. Each value is a content address of bytes the same row already prints: all 19 were reproduced by
# the shipped `captureRecordKey` over the records beside them, and 17 distinct values cover the 19 rows,
# because three accepted rows differ only in what the caller pinned, so they hold one record and state one
# key. Nothing secret is named, and a row whose stated key is not its record’s digest is refused by the
# suite that replays them.
#
# Measured on 8.30.1 against the history of this branch: the scan reports 19 findings in this file with no
# block below, and reports nothing with it. The narrowing checks ran on the same release against synthetic
# repositories carrying this config: a different 64-hex value written at the same shape in a file at this
# path is still reported, and any value listed below copied to another path is still reported. The
# exemption is the intersection of the two lines below and not either one alone, and the file is
# generated, so a value pasted over one of its slots also fails the job that regenerates it.
[[allowlists]]
description = "The capture fixture’s record keys, in the file that publishes them"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^1dd149cbbecdfd2246862c8fdfeb6649463a5b631aaefba7e4ae63cacbc51bed$''',
  '''^2eda90c63cf619ceb7e258af9c7b8ea24d8420707e00c1365f6b777bef29498b$''',
  '''^2f7c4692a1d41d8250b097c3945bb92be214fed3b123601a177dd54f5f3d810d$''',
  '''^3dbbd83353f2804c59c22c14d3f9fa572c7775b6aca4b7ce243fc2e318f3be4d$''',
  '''^40acb03e48dba1127a2f4b9b52d9c72d0c422e5494cd99e30501d0d4e754bde0$''',
  '''^619db8d3b300a6b184e615e8ef30f68a571d5b23e12a516b4e89b87928422e32$''',
  '''^69c8b3955541b012f3121300dfd4aea4f395cd6662288bf7ec608dcccc1dcb43$''',
  '''^8d8857b0f40e705c357bc10d8fc0b769d6224a954fedd6142ab1c3a3fa1f9386$''',
  '''^98b60679ba7eece650b0f00f8a60b61399337766868b1eb7999889c3b9d7a8dc$''',
  '''^9b7994662139f6c9a95c6183c09723a21bcd7a7d0a7c61f5d617d81ea78d3db7$''',
  '''^ac30a0ac5fd596b6e3f3c1a1e74527d3642824de4f356a89f89dfbce1940b6af$''',
  '''^bb5c669a351850192efc6e56d3e62716501c2473fe2bc9da44b238d3433d3b5b$''',
  '''^c3104a39a4ae3b7931ec22f3613ca7074ad3184ff86cd0a1d090a857ee018a0d$''',
  '''^cf78592627f7b3f3a7da047818513c43be88b8fdf44a13c95eee862eb2d59a13$''',
  '''^eeddad0c87eb2ccc0dde2bac1d63d03260e0e58e9754fe626138e6f7b704e231$''',
  '''^f69e0d49e07f8428a7ac6f4077b5c5e160441a480c1ffdd2e2b0d2689f5abd65$''',
  '''^f772189e549e243bffce6936eafb22e3353a83b68cba032fdb59ef61b87a5ef0$'''
]
paths = [
  '''^packages/fixtures/data/capture-v1\.json$''',
]
