services:
  # OpenAI-compatible inference on the loopback network only. The receipt gateway is
  # the sole public entry point, so this service publishes nothing.
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - /models/tinyllama-1.1b-chat-v1.Q4_K_M.gguf
      - --alias
      - tinyllama
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "4096"
      - -ngl
      - "0"
    volumes:
      - ./release:/models:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  gateway:
    # Built by enclave/Dockerfile from this repository; push it and pin the digest
    # before deploying, because the compose text is what the platform measures.
    image: ghcr.io/ashaveri/signerd:latest
    command:
      - --live
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --public-url
      - ${ASHAVERI_PUBLIC_URL:?set to the https URL this deployment is reachable at}
      - --upstream
      - http://inference:8080/v1
      - --model
      - tinyllama
      - --weights-manifest
      - /run/ashaveri/weights-manifest.json
      # --receipts-dir is absent on purpose: with it receipts are appended to a chained file and
      # survive a restart, which is a promise only a volume that outlives the VM can keep.
      # README.md section 3 is the check to run before making it.
      - --tee
      - ${ASHAVERI_TEE:-tdx}
      - --credentials-path
      - /run/ashaveri/credentials.json
      - --access-log-path
      - /var/lib/ashaveri/access-log
    ports:
      - "8081:8081"
    environment:
      ASHAVERI_WEIGHTS_DIR: /run/ashaveri
      ASHAVERI_WEIGHTS_MANIFEST: /run/ashaveri/weights-manifest.json
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - ./release:/run/ashaveri:ro
      - access-log:/var/lib/ashaveri/access-log
    depends_on:
      - inference
    restart: unless-stopped
    healthcheck:
      # Every route needs a credential now, so a probe looking for a 200 would have to carry one, and a
      # probe that can authenticate is a probe that can be mistaken for a client. Whether the listener
      # accepts a connection is the fact this probe owns; who may use it is decided on every real
      # request, by the pipeline.
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(8081,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  # The access log lives here because it is the one artifact the gateway writes and cannot
  # reconstruct. A named volume still dies with the VM, so the window this container reports is the
  # window of this boot rather than of the deployment, and the start-up line is what says so.
  # README.md section 3 is the check that decides whether that is enough here.
  access-log:
